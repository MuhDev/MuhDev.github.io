<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Obsidian Canvas -->
    <linearGradient id="bgObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141525" />
      <stop offset="45%" stop-color="#0a0a10" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Glass Rim Border Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.42)" />
      <stop offset="25%" stop-color="rgba(99, 102, 241, 0.6)" />
      <stop offset="65%" stop-color="rgba(168, 85, 247, 0.4)" />
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.65)" />
    </linearGradient>

    <!-- MuhDev Signature Gradient: Cyber Cyan -> Royal Blue -> Indigo -> Electric Violet -> Vivid Magenta -->
    <linearGradient id="muhDevGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="22%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="78%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>

    <!-- Ambient Glowing Light Orbs -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32" result="blur" />
    </filter>

    <!-- Sharp Icon Drop Shadow & Glow -->
    <filter id="glyphGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blurGlow" />
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.75" />
      <feMerge>
        <feMergeNode in="blurGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Apple-Style Superellipse Squircle -->
  <rect x="22" y="22" width="468" height="468" rx="116" ry="116" 
        fill="url(#bgObsidian)" 
        stroke="url(#rimGrad)" 
        stroke-width="3" />

  <!-- Ambient Light Halos -->
  <g opacity="0.35" filter="url(#softGlow)">
    <circle cx="160" cy="180" r="90" fill="#06b6d4" />
    <circle cx="256" cy="256" r="110" fill="#6366f1" />
    <circle cx="360" cy="330" r="90" fill="#a855f7" />
  </g>

  <!-- Specular Reflection Highlight (Apple Glass Arc) -->
  <path d="M 38,124 C 38,72 74,44 126,38 L 386,38 C 438,44 474,72 474,124 C 474,142 414,116 358,110 C 274,102 168,118 38,124 Z" 
        fill="rgba(255, 255, 255, 0.08)" />

  <!-- Master MuhDev Glyph: < M > Unified Synthesis -->
  <g filter="url(#glyphGlow)">
    <!-- Opening Tag '<' (Left Wing): Cyber Cyan to Blue -->
    <path d="M 186,156 L 118,256 L 186,356" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Central Apex Peak '/' (Core Mountain of M): Royal Blue -> Indigo -> Electric Purple -->
    <path d="M 204,356 L 256,156 L 308,356" 
          fill="none" 
          stroke="url(#muhDevGrad)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Closing Tag '>' (Right Wing): Electric Purple to Vivid Magenta -->
    <path d="M 326,156 L 394,256 L 326,356" 
          fill="none" 
          stroke="url(#magentaGrad)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Core Dev Node (Cyan Terminal Prompt Pulse) -->
    <circle cx="256" cy="276" r="10" fill="#22d3ee" />
    <circle cx="256" cy="276" r="20" fill="#06b6d4" opacity="0.4" filter="url(#softGlow)" />
  </g>
</svg>